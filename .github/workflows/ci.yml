name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: converse, POSTGRES_PASSWORD: converse, POSTGRES_DB: converse }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U converse" --health-interval 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app evals tests
      - run: uv run pytest tests/test_unit.py -q
      # Integration + MCP tests need seeded data (and embeddings from Ollama); run locally with `make test`.
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b && npm run build
