# LoRA distillation of the Converse tool-calling agent into Qwen2.5-1.5B-Instruct.
model: Qwen/Qwen2.5-1.5B-Instruct
train: true
data: data
fine_tune_type: lora
mask_prompt: true          # learn only the assistant's answer (tool calls / reply), not the long prompt
num_layers: 28             # adapt all transformer blocks
batch_size: 2
grad_accumulation_steps: 4 # effective batch 8
iters: 900                 # x batch 2 = 1,800 examples seen (~0.75 epoch of 2,400)
learning_rate: 1.0e-4
max_seq_length: 4096
grad_checkpoint: true      # trade compute for memory on a 16 GB machine
steps_per_report: 20
steps_per_eval: 150
val_batches: 20
save_every: 150
adapter_path: adapters
seed: 7
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
  rank: 16
  scale: 2.0
  dropout: 0.05
